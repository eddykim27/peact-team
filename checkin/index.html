<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>피스팀 출퇴근 체크</title>
<meta name="theme-color" content="#262C52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: 휴대폰 한 화면. 위에 시계, 가운데 이름, 아래 큰 출근/퇴근 버튼 두 개 */
  :root {
    --bg: #F5F3F0; --surface: #FFFFFF; --surface-2: #FAF8F6; --ink: #1F2433; --ink-2: #5A6074; --ink-3: #9AA0AE; --line: #ECE7E1;
    --accent: #E4875A; --accent-2: #F3B48B; --hero-1: #262C52; --hero-2: #4A4F9A;
    --ok-bg: #E2F5EA; --ok: #1E7A4C; --bad-bg: #FDE6E4; --bad: #C23F37; --out-bg: #E7E9FF; --out: #4A4FC2;
    --shadow: 0 1px 2px rgba(31,36,51,.04), 0 8px 24px rgba(31,36,51,.07);
    --f-display: 'Jua', 'Noto Sans KR', system-ui, sans-serif; --f-body: 'Noto Sans KR', system-ui, sans-serif; --f-num: 'Outfit', 'Noto Sans KR', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12141C; --surface: #1C1F2A; --surface-2: #222634; --ink: #EEF0F5; --ink-2: #B3B8C6; --ink-3: #7C8293; --line: #2D3142;
      --accent: #F09A6C; --accent-2: #F6BD98; --hero-1: #222852; --hero-2: #3D428A;
      --ok-bg: #173527; --ok: #6FD6A0; --bad-bg: #3D1E1F; --bad: #FF8F87; --out-bg: #24275A; --out: #A9ADFF;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--f-body); color: var(--ink); background: var(--bg);
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  button { font-family: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
  .ico { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .hero { position: relative; overflow: hidden; border-radius: 28px; color: #fff; padding: 22px 22px 26px; background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); box-shadow: 0 18px 40px rgba(38,44,82,.28); }
  .hero::before { content: ""; position: absolute; width: 260px; height: 260px; right: -70px; top: -130px; border-radius: 50%; background: radial-gradient(circle, rgba(243,180,139,.55), transparent 65%); }
  .hero-top { display: flex; align-items: center; gap: 10px; position: relative; font-size: 14px; opacity: .85; }
  .hero-top .ico { font-size: 18px; }
  .clock { position: relative; font-family: var(--f-num); font-weight: 700; font-size: 64px; line-height: 1; margin-top: 18px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .clock small { font-size: 26px; opacity: .6; margin-left: 4px; }
  .date { position: relative; margin-top: 6px; font-size: 15px; opacity: .8; }

  .card { background: var(--surface); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-family: var(--f-display); font-size: 21px; background: #FFE3D3; color: #B4532A; flex: none; }
  .who-name { font-family: var(--f-display); font-size: 22px; line-height: 1.2; }
  .who-sub { font-size: 13px; color: var(--ink-3); }
  .link-btn { margin-left: auto; border: 1px solid var(--line); background: var(--surface-2); padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; flex: none; }

  .names-title { font-weight: 700; margin-bottom: 12px; }
  .names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .name-btn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 10px; border-radius: 16px; font-size: 16px; font-weight: 500; cursor: pointer; text-align: left; }
  .name-btn .avatar { width: 36px; height: 36px; border-radius: 12px; font-size: 16px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .act {
    border: none; border-radius: 26px; padding: 26px 12px 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-family: var(--f-display); font-size: 26px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .2s;
  }
  .act .ico { font-size: 34px; }
  .act:active { transform: scale(.97); }
  .act-in { background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 12px 26px rgba(228,135,90,.35); }
  .act-out { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .act.suggest { outline: 3px solid var(--accent-2); outline-offset: 3px; }
  .act[disabled] { opacity: .55; cursor: wait; }

  .result { border-radius: 24px; padding: 20px; display: flex; gap: 14px; align-items: center; animation: pop .35s cubic-bezier(.2,.9,.3,1.3); }
  .result .ico { font-size: 30px; }
  .result-title { font-family: var(--f-display); font-size: 22px; }
  .result-sub { font-size: 14px; opacity: .85; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.bad { background: var(--bad-bg); color: var(--bad); }
  .result.info { background: var(--out-bg); color: var(--out); }
  @keyframes pop { from { transform: scale(.94); } to { transform: none; } }

  .foot { text-align: center; font-size: 12px; color: var(--ink-3); }
  .foot a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <section class="hero">
    <div class="hero-top"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>피스팀 출퇴근 체크</div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </section>

  <section class="card" id="who-card" hidden>
    <div class="who">
      <span class="avatar" id="who-avatar"></span>
      <div><div class="who-name" id="who-name"></div><div class="who-sub">이 휴대폰에 저장됨</div></div>
      <button type="button" class="link-btn" id="change-btn">이름 바꾸기</button>
    </div>
  </section>

  <section class="card" id="pick-card" hidden>
    <div class="names-title">내 이름을 골라주세요</div>
    <div class="names" id="names"><div class="who-sub">이름을 불러오는 중이에요…</div></div>
  </section>

  <section class="actions" id="actions" hidden>
    <button type="button" class="act act-in" id="btn-in"><svg class="ico" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/></svg>출근</button>
    <button type="button" class="act act-out" id="btn-out"><svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>퇴근</button>
  </section>

  <div id="result"></div>

  <p class="foot"><a href="../">출퇴근 대시보드 보기</a></p>
</main>

<script>
  /* ===== 설정 ===== */
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwH2eqe8OOLnLBAIwtqWufrWbfQ04bokecHFaPESUmVm9SPYk9RUk4zbff-_ZztBUXoKQ/exec';
  const SPREADSHEET_ID = '19jbMmqpyRtGIoU3kF72xNwo6ZtpGAG56bTV1MIaG1Vw';

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const initial = n => n.length >= 3 ? n.slice(1, 2) : n.slice(0, 1);

  /* QR 주소의 k 값을 기억 */
  const urlKey = new URLSearchParams(location.search).get('k');
  if (urlKey) store.set('fia-key', urlKey);
  const KEY = urlKey || store.get('fia-key') || '';

  /* 시계 */
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  function tick() {
    const d = new Date();
    $('clock').innerHTML = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}<small>${String(d.getSeconds()).padStart(2, '0')}</small>`;
    $('date').textContent = `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
    const suggestIn = d.getHours() < 14;
    $('btn-in').classList.toggle('suggest', suggestIn);
    $('btn-out').classList.toggle('suggest', !suggestIn);
  }
  tick(); setInterval(tick, 1000);

  function showResult(kind, title, sub) {
    const icon = kind === 'ok' ? '<path d="M20 6 9 17l-5-5"/>' : kind === 'bad' ? '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>' : '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
    $('result').innerHTML = `<div class="result ${kind}"><svg class="ico" viewBox="0 0 24 24">${icon}</svg><div><div class="result-title">${esc(title)}</div>${sub ? `<div class="result-sub">${esc(sub)}</div>` : ''}</div></div>`;
  }

  /* JSONP 도우미 (구글 시트 / Apps Script 둘 다 이 방식으로 부릅니다) */
  let seq = 0;
  function jsonp(url, cbParam) {
    return new Promise((resolve, reject) => {
      const cb = '__fia' + (++seq) + Date.now();
      const s = document.createElement('script');
      const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 20000);
      function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = data => { done(); resolve(data); };
      s.onerror = () => { done(); reject(new Error('network')); };
      s.src = url + (url.includes('?') ? '&' : '?') + cbParam(cb);
      document.head.appendChild(s);
    });
  }

  /* 이름 목록: 기본정보 탭에서 퇴사하지 않은 사람 */
  async function loadNames() {
    const res = await jsonp(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?headers=1&sheet=${encodeURIComponent('기본정보')}&_=${Date.now()}`, cb => `tqx=out:json;responseHandler:${cb}`);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const seen = new Set(), names = [];
    (res.table?.rows || []).forEach(r => {
      const c = r.c || [];
      const name = String(c[0]?.v ?? '').trim();
      if (!name || seen.has(name)) return;
      const resign = String(c[8]?.f ?? c[8]?.v ?? '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
      if (resign && new Date(+resign[1], +resign[2] - 1, +resign[3]) < today) return;
      seen.add(name); names.push(name);
    });
    return names;
  }

  function renderPicker(names) {
    $('names').innerHTML = '';
    names.forEach(n => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'name-btn';
      b.innerHTML = `<span class="avatar">${esc(initial(n))}</span>${esc(n)}`;
      b.onclick = () => { store.set('fia-name', n); render(); };
      $('names').appendChild(b);
    });
  }

  let allNames = [];
  function render() {
    const name = store.get('fia-name');
    const valid = name && (!allNames.length || allNames.includes(name));
    $('who-card').hidden = !valid;
    $('actions').hidden = !valid;
    $('pick-card').hidden = !!valid;
    if (valid) { $('who-name').textContent = name + ' 간사님'; $('who-avatar').textContent = initial(name); }
    $('result').innerHTML = '';
    if (!KEY) showResult('bad', '사무실 QR코드로 열어주세요', '사무실에 붙어 있는 QR코드를 찍으면 체크할 수 있어요.');
    else if (!WEB_APP_URL) showResult('info', '아직 연결 준비 중이에요', '관리자가 시트 연결을 마치면 바로 쓸 수 있어요.');
  }
  $('change-btn').onclick = () => { store.del('fia-name'); render(); };

  function getLocation() {
    return new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
        () => resolve(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
    });
  }

  async function check(action) {
    const name = store.get('fia-name');
    if (!name) return;
    if (!KEY) return showResult('bad', '사무실 QR코드로 열어주세요', '사무실에 붙어 있는 QR코드를 찍으면 체크할 수 있어요.');
    if (!WEB_APP_URL) return showResult('info', '아직 연결 준비 중이에요', '관리자가 시트 연결을 마치면 바로 쓸 수 있어요.');
    $('btn-in').disabled = $('btn-out').disabled = true;
    showResult('info', action === 'in' ? '출근 기록 중…' : '퇴근 기록 중…', '잠시만 기다려 주세요.');
    try {
      const loc = await getLocation();
      const q = new URLSearchParams({ name, action, k: KEY });
      if (loc) { q.set('lat', loc.lat); q.set('lng', loc.lng); q.set('acc', loc.acc); }
      const res = await jsonp(`${WEB_APP_URL}?${q}`, cb => `callback=${cb}`);
      if (res && res.ok) showResult(res.kept ? 'info' : 'ok', res.message, res.kept ? '처음 찍은 출근 시간이 그대로 남아요.' : `${name} 간사님 · 시트에 저장됐어요`);
      else showResult('bad', (res && res.message) || '기록하지 못했어요', '잠시 후 다시 눌러주세요. 계속 안 되면 관리자에게 알려주세요.');
    } catch (e) {
      showResult('bad', '연결이 안 돼요', '인터넷 연결을 확인하고 다시 눌러주세요.');
    } finally {
      $('btn-in').disabled = $('btn-out').disabled = false;
    }
  }
  $('btn-in').onclick = () => check('in');
  $('btn-out').onclick = () => check('out');

  render();
  loadNames().then(n => { allNames = n; renderPicker(n); render(); })
    .catch(() => { $('names').innerHTML = '<div class="who-sub">이름을 불러오지 못했어요. 새로고침해 주세요.</div>'; });
</script>
</body>
</html>
